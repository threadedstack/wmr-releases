# The hosted site (https://wmr.threadedstack.com, Firebase Hosting site wmr-app of project wmn-runbooks) is deployed from here
# on GitHub Actions, so a wmr release never needs `firebase login` on the Mac that builds it. Source: release/hosted-site.yml of
# threadedstack/wmr, installed as .github/workflows/hosted-site.yml of threadedstack/wmr-releases (release/SETUP.md).
#
# The Mac release (scripts/release-steps.ts, the fallback) builds the site folder, uploads it as wmr-site-<version>.tar.gz (+ .sha256) to
# the DRAFT release "site-staging" of this repository, and dispatches this workflow by hand with the version and a stage:
#   preview  - deploys the site to the preview channel release-v<X-Y-Z> (7 days), after deleting old channels (the 2 newest
#              versions' release and before- channels stay), and puts the preview's address in site-preview-url-<version>.txt on
#              site-staging, which the release reads for its live check
#   promote  - keeps the live version as the channel before-release-v<X-Y-Z> (the first copy only), then makes the preview live
#   rollback - puts that kept version live again
# Firebase sign-in is keyless (Workload Identity Federation): pool "github" of project wmn-runbooks accepts threadedstack repositories,
# and gh-actions-deploy@wmn-runbooks needs the workloadIdentityUser binding for this repository (docs/DEPLOY.md).
#
# The release workflow (release.yml of this repository, source release/release.yml of wmr) calls this file as a reusable workflow
# (workflow_call) with the same inputs, and with site_artifact: the name of an artifact of the calling run that holds the site
# archive. The site then comes from that artifact, and the preview's address goes back as the output preview_url instead of to
# site-staging.
name: Hosted site

on:
  workflow_dispatch:
    inputs:
      version:
        description: "wmr version (for example 0.1.4)"
        required: true
      stage:
        description: "preview, promote or rollback"
        required: true
        type: choice
        options: [preview, promote, rollback]
  workflow_call:
    inputs:
      version:
        description: "wmr version (for example 0.1.4)"
        required: true
        type: string
      stage:
        description: "preview, promote or rollback"
        required: true
        type: string
      site_artifact:
        description: "an artifact of the calling run with the site archive (preview only); empty: site-staging"
        required: false
        type: string
        default: ""
    outputs:
      preview_url:
        description: the preview channel's address (preview only)
        value: ${{ jobs.deploy.outputs.preview_url }}

permissions:
  contents: write
  id-token: write

concurrency:
  group: hosted-site
  cancel-in-progress: false

env:
  SITE: wmr-app
  PROJECT: wmn-runbooks
  STAGING: site-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      preview_url: ${{ steps.preview.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SITE_ARTIFACT: ${{ inputs.site_artifact }}
    steps:
      - name: Version and channel
        run: |
          v="${VERSION#v}"
          case "$v" in ''|*[!0-9.]*) echo "bad version: $VERSION" >&2; exit 1;; esac
          echo "V=$v" >> "$GITHUB_ENV"
          echo "CHANNEL=release-v${v//./-}" >> "$GITHUB_ENV"

      - name: The site from the calling run (preview)
        if: ${{ inputs.stage == 'preview' && inputs.site_artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.site_artifact }}
          path: ${{ runner.temp }}/dl

      - name: The site from site-staging (preview)
        if: ${{ inputs.stage == 'preview' && inputs.site_artifact == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          gh release download "$STAGING" --repo "$GITHUB_REPOSITORY" --pattern "wmr-site-$V.tar.gz" --pattern "wmr-site-$V.tar.gz.sha256" --clobber

      - name: Check the site (preview)
        if: ${{ inputs.stage == 'preview' }}
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/dl"
          shasum -a 256 -c "wmr-site-$V.tar.gz.sha256"
          tar -xzf "wmr-site-$V.tar.gz" -C "$RUNNER_TEMP/site"

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/79296749603/locations/global/workloadIdentityPools/github/providers/github
          service_account: gh-actions-deploy@wmn-runbooks.iam.gserviceaccount.com

      - run: npm install -g firebase-tools@15.16.0

      - name: Delete old channels (preview)
        if: ${{ inputs.stage == 'preview' }}
        working-directory: ${{ runner.temp }}/site
        run: |
          # the site's channels are capped (50): only the 2 newest versions' release and before- channels stay, and this version's own
          firebase hosting:channel:list --site "$SITE" --json --project "$PROJECT" > "$RUNNER_TEMP/channels.json"
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync(process.env.RUNNER_TEMP + "/channels.json", "utf8");
            const names = (JSON.parse(text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1)).result?.channels ?? [])
              .map((c) => (c.name ?? "").split("/").at(-1));
            const ver = (n) => /^(?:before-)?release-v(\d+)-(\d+)-(\d+)$/.exec(n)?.slice(1).map(Number);
            const key = (v) => v.map((x) => String(x).padStart(6, "0")).join(".");
            const versions = [...new Set(names.map(ver).filter(Boolean).map(key))].sort().reverse();
            const kept = new Set([...versions.slice(0, 2), key(ver(process.env.CHANNEL))]);
            console.log(names.filter((n) => ver(n) && !kept.has(key(ver(n)))).join("\n"));
          ' > "$RUNNER_TEMP/drop.txt"
          while read -r id; do
            [ -n "$id" ] && firebase hosting:channel:delete "$id" --site "$SITE" --force --project "$PROJECT"
          done < "$RUNNER_TEMP/drop.txt"
          exit 0

      - name: Deploy the preview channel
        id: preview
        if: ${{ inputs.stage == 'preview' }}
        working-directory: ${{ runner.temp }}/site
        run: |
          firebase hosting:channel:deploy "$CHANNEL" --only "$SITE" --expires 7d --json --project "$PROJECT" > "$RUNNER_TEMP/deploy.json"
          cat "$RUNNER_TEMP/deploy.json"
          url=$(node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.env.RUNNER_TEMP + "/deploy.json", "utf8");
            const j = JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
            process.stdout.write(j.result?.[process.env.SITE]?.url ?? "");
          ')
          if [ -z "$url" ]; then echo "the preview channel deploy printed no url" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # a release run by hand from a Mac reads the address from site-staging; a call from the release run takes the output
          if [ -z "$SITE_ARTIFACT" ]; then
            printf '%s' "$url" > "$RUNNER_TEMP/site-preview-url-$V.txt"
            gh release upload "$STAGING" "$RUNNER_TEMP/site-preview-url-$V.txt" --clobber --repo "$GITHUB_REPOSITORY"
          fi
          echo "preview: $url"

      - name: A Firebase folder (promote, rollback)
        if: ${{ inputs.stage != 'preview' }}
        # the firebase CLI refuses hosting commands outside a folder with a firebase.json; the site folder only exists for preview
        run: |
          mkdir -p "$RUNNER_TEMP/fb"
          printf '{"hosting":{"site":"%s","public":"."}}\n' "$SITE" > "$RUNNER_TEMP/fb/firebase.json"

      - name: Promote
        if: ${{ inputs.stage == 'promote' }}
        working-directory: ${{ runner.temp }}/fb
        run: |
          firebase hosting:channel:list --site "$SITE" --json --project "$PROJECT" > "$RUNNER_TEMP/channels.json"
          if ! grep -q "/channels/$CHANNEL\"" "$RUNNER_TEMP/channels.json"; then echo "$SITE has no channel $CHANNEL" >&2; exit 1; fi
          # what is live now is kept, so a rollback can put it back (the first copy only: a resumed release never keeps its own)
          if grep -q "/channels/before-$CHANNEL\"" "$RUNNER_TEMP/channels.json"; then
            echo "before-$CHANNEL is kept already"
          else
            firebase hosting:clone "$SITE:live" "$SITE:before-$CHANNEL" --project "$PROJECT"
          fi
          firebase hosting:clone "$SITE:$CHANNEL" "$SITE:live" --project "$PROJECT"

      - name: Roll back
        if: ${{ inputs.stage == 'rollback' }}
        working-directory: ${{ runner.temp }}/fb
        run: firebase hosting:clone "$SITE:before-$CHANNEL" "$SITE:live" --project "$PROJECT"
